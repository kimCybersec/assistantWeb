{% extends "base.html" %}

{% block content %}
<div class="generate-container">
    <h2>Generate New Schedule</h2>
    <form method="POST">
        <div class="form-group">
            <label for="goal">What is your goal for this week?</label>
            <input type="text" id="goal" name="goal" required>
        </div>
        <button type="submit" class="submit-btn generate-btn">
            Generate Schedule
            <span class="submit-icon">→</span>
        </button>
    </form>
</div>
{% endblock %}
